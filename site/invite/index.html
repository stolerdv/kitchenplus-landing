:root{--canvas:#0C0A09;--panel:rgba(24,20,17,.88);--line:rgba(255,255,255,.09);--accent:#D4AF37;--accent-hover:#E2C25A;--text:#F6F1E8;--text-2:#B9AEA2;
--display:'Cormorant Garamond',Georgia,'Times New Roman',serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#1b1612 0%,var(--canvas) 60%);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 28px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{width:68px;height:68px;border-radius:16px;margin:0 auto 18px;display:block}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 12px;text-wrap:balance}
p{margin:0 0 22px;color:var(--text-2);text-wrap:pretty}
.btn{display:block;width:100%;padding:15px 18px;border-radius:14px;background:var(--accent);color:#1a1405;font-weight:600;font-size:16px;text-decoration:none;transition:background .15s}
.btn:hover,.btn:focus-visible{background:var(--accent-hover)}
.btn:focus-visible,.store:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.sep{height:1px;background:var(--line);margin:26px 0 20px}
.small{font-size:14px;color:var(--text-2);margin:0 0 14px}
.store{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;text-align:left;background:rgba(255,255,255,.03)}
.store:hover{border-color:rgba(255,255,255,.3)}
.store img{width:26px;height:26px;object-fit:contain}
.store small{display:block;font-size:11px;color:var(--text-2);line-height:1.1}
.store b{font-size:16px;font-weight:600;line-height:1.2}
.soon{margin:14px 0 0;font-size:13px;color:var(--text-2)}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/assets/favicon-192.png" alt="KitchenPlus">
  <h1 id="t-title">Приглашение в KitchenPlus</h1>
  <p id="t-text">Вас пригласил специалист. Откройте приглашение в приложении и выберите, какие данные ему показывать.</p>
  <a class="btn" id="open" href="kitchenplus://invite">Открыть в приложении</a>
  <div class="sep"></div>
  <p class="small" id="t-noapp">Приложения ещё нет?</p>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.stolerdv.kitchenplus"><img src="/assets/gplay.png" alt=""><span><small id="t-avail">Доступно в</small><b>Google Play</b></span></a>
  <p class="soon" id="t-soon">Версия для iPhone скоро появится.</p>
</main>
<script>
(function(){
  var T={
    ru:{title:'Приглашение в KitchenPlus',text:'Вас пригласил специалист. Откройте приглашение в приложении и выберите, какие данные ему показывать.',open:'Открыть в приложении',noapp:'Приложения ещё нет?',avail:'Доступно в',soon:'Версия для iPhone скоро появится.'},
    en:{title:'You\u2019re invited to KitchenPlus',text:'A specialist has invited you. Open the invitation in the app and choose which data to share with them.',open:'Open in the app',noapp:'Don\u2019t have the app yet?',avail:'Get it on',soon:'The iPhone version is coming soon.'},
    kk:{title:'KitchenPlus-\u049B\u0430 \u0448\u0430\u049B\u044B\u0440\u0443',text:'\u0421\u0456\u0437\u0434\u0456 \u043C\u0430\u043C\u0430\u043D \u0448\u0430\u049B\u044B\u0440\u0434\u044B. \u0428\u0430\u049B\u044B\u0440\u0443\u0434\u044B \u049B\u043E\u0441\u044B\u043C\u0448\u0430\u0434\u0430 \u0430\u0448\u044B\u043F, \u043E\u0493\u0430\u043D \u049B\u0430\u043D\u0434\u0430\u0439 \u0434\u0435\u0440\u0435\u043A\u0442\u0435\u0440 \u043A\u04E9\u0440\u0456\u043D\u0435\u0442\u0456\u043D\u0456\u043D \u0442\u0430\u04A3\u0434\u0430\u04A3\u044B\u0437.',open:'\u049A\u043E\u0441\u044B\u043C\u0448\u0430\u0434\u0430 \u0430\u0448\u0443',noapp:'\u049A\u043E\u0441\u044B\u043C\u0448\u0430 \u04D9\u043B\u0456 \u0436\u043E\u049B \u043F\u0430?',avail:'\u049B\u043E\u043B\u0436\u0435\u0442\u0456\u043C\u0434\u0456',soon:'iPhone \u043D\u04B1\u0441\u049B\u0430\u0441\u044B \u0436\u0430\u049B\u044B\u043D\u0434\u0430 \u0448\u044B\u0493\u0430\u0434\u044B.'}
  };
  var qs=new URLSearchParams(location.search);
  var lang=(qs.get('lang')||navigator.language||'ru').slice(0,2).toLowerCase();
  if(!T[lang]) lang='ru';
  var t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.title;
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-text').textContent=t.text;
  document.getElementById('open').textContent=t.open;
  document.getElementById('t-noapp').textContent=t.noapp;
  document.getElementById('t-avail').textContent=t.avail;
  document.getElementById('t-soon').textContent=t.soon;
  var token=qs.get('token');
  var href='kitchenplus://invite'+(token?'?token='+encodeURIComponent(token):'');
  document.getElementById('open').setAttribute('href',href);
})();
</script>
</body>
</html>
